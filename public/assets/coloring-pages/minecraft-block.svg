<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <g stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3D Block - isometric view -->
    <!-- Top face -->
    <polygon points="960,120 1360,320 960,520 560,320"/>
    <!-- Left face -->
    <polygon points="560,320 960,520 960,820 560,620"/>
    <!-- Right face -->
    <polygon points="960,520 1360,320 1360,620 960,820"/>
    <!-- Top face grid (grass texture) -->
    <line x1="660" y1="220" x2="1060" y2="420"/>
    <line x1="760" y1="170" x2="1160" y2="370"/>
    <line x1="860" y1="120" x2="1260" y2="320"/>
    <line x1="760" y1="270" x2="1160" y2="70" transform="rotate(0)"/>
    <line x1="660" y1="320" x2="1060" y2="120"/>
    <line x1="760" y1="370" x2="1160" y2="170"/>
    <line x1="860" y1="420" x2="1260" y2="220"/>
    <!-- Top cross lines -->
    <line x1="760" y1="220" x2="560" y2="320"/>
    <line x1="860" y1="170" x2="660" y2="270"/>
    <line x1="1060" y1="220" x2="860" y2="320"/>
    <line x1="1160" y1="270" x2="960" y2="370"/>
    <line x1="1260" y1="320" x2="1060" y2="420"/>
    <!-- Left face grid (dirt texture) -->
    <line x1="560" y1="395" x2="960" y2="595"/>
    <line x1="560" y1="470" x2="960" y2="670"/>
    <line x1="560" y1="545" x2="960" y2="745"/>
    <line x1="660" y1="370" x2="660" y2="670"/>
    <line x1="760" y1="420" x2="760" y2="720"/>
    <line x1="860" y1="470" x2="860" y2="770"/>
    <!-- Right face grid (dirt texture) -->
    <line x1="960" y1="595" x2="1360" y2="395"/>
    <line x1="960" y1="670" x2="1360" y2="470"/>
    <line x1="960" y1="745" x2="1360" y2="545"/>
    <line x1="1060" y1="470" x2="1060" y2="770"/>
    <line x1="1160" y1="420" x2="1160" y2="720"/>
    <line x1="1260" y1="370" x2="1260" y2="670"/>
    <!-- Small scattered pixels on top face (grass detail) -->
    <rect x="920" y="260" width="20" height="10" transform="skewX(-25)"/>
    <rect x="780" y="280" width="15" height="8" transform="skewX(-25)"/>
    <rect x="1050" y="300" width="18" height="9" transform="skewX(-25)"/>
    <!-- Dirt speckles on left face -->
    <circle cx="680" cy="480" r="6"/>
    <circle cx="780" cy="560" r="5"/>
    <circle cx="620" cy="560" r="4"/>
    <circle cx="720" cy="640" r="5"/>
    <circle cx="850" cy="650" r="4"/>
    <!-- Dirt speckles on right face -->
    <circle cx="1100" cy="460" r="5"/>
    <circle cx="1200" cy="520" r="6"/>
    <circle cx="1050" cy="580" r="4"/>
    <circle cx="1250" cy="580" r="5"/>
    <circle cx="1150" cy="650" r="4"/>
    <!-- Small blocks scattered around -->
    <!-- Small block left -->
    <polygon points="300,650 400,700 300,750 200,700"/>
    <polygon points="200,700 300,750 300,820 200,770"/>
    <polygon points="300,750 400,700 400,770 300,820"/>
    <!-- Small block right -->
    <polygon points="1550,600 1630,640 1550,680 1470,640"/>
    <polygon points="1470,640 1550,680 1550,740 1470,700"/>
    <polygon points="1550,680 1630,640 1630,700 1550,740"/>
    <!-- Pickaxe -->
    <line x1="250" y1="350" x2="450" y2="550"/>
    <path d="M230,350 L210,310 L250,290 L290,310 L270,350 L250,340 Z"/>
  </g>
</svg>
