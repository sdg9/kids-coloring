    <circle cx="1090" cy="415" r="5"/>

    <!-- Cow mouth -->
    <path d="M1065 432 Q1080 442 1095 432"/>

    <!-- Cow tail -->
    <path d="M600 480 Q540 440 520 410 Q510 395 530 400 Q540 405 535 420"/>

    <!-- Cow bell -->
    <path d="M1000 490 L1000 510 L1020 510 L1020 490"/>
    <ellipse cx="1010" cy="490" rx="12" ry="5"/>
    <circle cx="1010" cy="505" r="3"/>

    <!-- Grass -->
    <path d="M100 750 Q110 725 120 750"/>
    <path d="M400 745 Q410 720 420 745"/>
    <path d="M1200 740 Q1210 715 1220 740"/>
    <path d="M1350 745 Q1360 720 1370 745"/>

    <!-- Flowers -->
    <circle cx="300" cy="745" r="12"/>
    <circle cx="300" cy="745" r="4"/>
    <line x1="300" y1="757" x2="300" y2="785"/>
