    <path d="M660 620 L650 750 L625 750 L625 735 L640 735 L650 620"/>
    <path d="M720 630 L715 750 L690 750 L690 735 L705 735 L710 630"/>
    <path d="M900 620 L910 750 L885 750 L885 735 L900 735 L910 620"/>
