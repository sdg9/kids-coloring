    <path d="M1000 510 Q1040 470 1070 440"/>

    <!-- Cow head -->
    <ellipse cx="1080" cy="390" rx="70" ry="55"/>

    <!-- Cow horns -->
    <path d="M1040 345 Q1020 310 1030 285"/>
    <path d="M1120" y1="345" d="M1120 345 Q1140 310 1130 285"/>

