    <line x1="250" y1="45" x2="250" y2="20"/>
    <line x1="250" y1="235" x2="250" y2="260"/>
    <line x1="155" y1="140" x2="130" y2="140"/>
    <line x1="345" y1="140" x2="370" y2="140"/>
    <line x1="184" y1="74" x2="165" y2="55"/>
