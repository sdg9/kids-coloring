<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <g stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mountains background -->
    <polygon points="0,600 300,250 600,600"/>
    <polygon points="400,600 750,200 1100,600"/>
    <polygon points="900,600 1250,280 1600,600"/>
    <polygon points="1300,600 1600,300 1920,600"/>
    <!-- Snow caps -->
    <polygon points="300,250 250,350 350,350"/>
    <polygon points="750,200 690,310 810,310"/>
    <polygon points="1250,280 1195,380 1305,380"/>
    <polygon points="1600,300 1550,390 1650,390"/>

    <!-- Ground -->
    <path d="M0 700 Q480 680 960 700 Q1440 720 1920 700"/>

    <!-- Panda body -->
    <!-- Body - big round belly -->
    <ellipse cx="700" cy="620" rx="130" ry="100"/>

    <!-- Head -->
    <circle cx="700" cy="460" r="90"/>

    <!-- Ears -->
    <circle cx="630" cy="390" r="30"/>
    <circle cx="770" cy="390" r="30"/>

    <!-- Eye patches -->
    <ellipse cx="670" cy="455" rx="28" ry="22"/>
    <ellipse cx="730" cy="455" rx="28" ry="22"/>

    <!-- Eyes -->
    <circle cx="670" cy="455" r="10"/>
    <circle cx="730" cy="455" r="10"/>
    <!-- Eye highlights -->
    <circle cx="675" cy="450" r="4"/>
    <circle cx="735" cy="450" r="4"/>

    <!-- Nose -->
    <ellipse cx="700" cy="485" rx="12" ry="8"/>

    <!-- Mouth -->
    <path d="M688 495 Q700 510 712 495"/>

    <!-- Front legs/arms -->
    <ellipse cx="610" cy="580" rx="40" ry="25" transform="rotate(-20 610 580)"/>
    <ellipse cx="790" cy="580" rx="40" ry="25" transform="rotate(20 790 580)"/>

    <!-- Back legs -->
    <ellipse cx="630" cy="700" rx="45" ry="25"/>
    <ellipse cx="770" cy="700" rx="45" ry="25"/>

    <!-- Belly patch -->
    <ellipse cx="700" cy="620" rx="70" ry="55"/>

    <!-- Bamboo stalks the panda is holding -->
    <!-- Bamboo 1 in paw -->
    <line x1="810" y1="400" x2="830" y2="700"/>
    <line x1="810" y1="420" x2="830" y2="420"/>
    <line x1="815" y1="500" x2="828" y2="500"/>
    <line x1="818" y1="580" x2="828" y2="580"/>
    <!-- Bamboo leaves -->
    <path d="M830 420 Q860 400 870 420 Q860 440 830 420"/>
    <path d="M810 420 Q780 400 770 420 Q780 440 810 420"/>
    <path d="M828 500 Q858 480 868 500 Q858 520 828 500"/>

    <!-- Bamboo forest behind -->
    <line x1="1300" y1="300" x2="1300" y2="700"/>
    <line x1="1290" y1="400" x2="1310" y2="400"/>
    <line x1="1290" y1="500" x2="1310" y2="500"/>
    <path d="M1300 400 Q1270 380 1260 400 Q1270 420 1300 400"/>
    <path d="M1300 400 Q1330 380 1340 400 Q1330 420 1300 400"/>
    <path d="M1300 500 Q1330 480 1340 500 Q1330 520 1300 500"/>

    <line x1="1400" y1="250" x2="1400" y2="700"/>
    <line x1="1390" y1="350" x2="1410" y2="350"/>
    <line x1="1390" y1="480" x2="1410" y2="480"/>
    <path d="M1400 350 Q1370 330 1360 350 Q1370 370 1400 350"/>
    <path d="M1400 350 Q1430 330 1440 350 Q1430 370 1400 350"/>
    <path d="M1400 480 Q1430 460 1440 480 Q1430 500 1400 480"/>

    <line x1="1500" y1="320" x2="1500" y2="700"/>
    <line x1="1490" y1="420" x2="1510" y2="420"/>
    <line x1="1490" y1="550" x2="1510" y2="550"/>
    <path d="M1500 420 Q1470 400 1460 420 Q1470 440 1500 420"/>
    <path d="M1500 550 Q1530 530 1540 550 Q1530 570 1500 550"/>

    <!-- Grass tufts -->
    <path d="M100 700 Q110 670 120 700"/>
    <path d="M400 700 Q410 675 420 700"/>
    <path d="M1100 700 Q1110 670 1120 700"/>
    <path d="M1700 700 Q1710 675 1720 700"/>

    <!-- Cloud -->
    <path d="M100 150 Q100 110 150 110 Q165 80 210 90 Q240 70 270 90 Q310 75 315 110 Q345 120 330 150 Q340 175 305 180 Q290 200 245 195 Q215 210 185 190 Q145 205 135 175 Q95 175 100 150 Z"/>

    <!-- Sun -->
    <circle cx="1750" cy="120" r="60"/>
    <line x1="1750" y1="35" x2="1750" y2="10"/>
    <line x1="1750" y1="205" x2="1750" y2="230"/>
    <line x1="1665" y1="120" x2="1640" y2="120"/>
    <line x1="1835" y1="120" x2="1860" y2="120"/>
    <line x1="1693" y1="63" x2="1675" y2="45"/>
    <line x1="1807" y1="63" x2="1825" y2="45"/>
    <line x1="1693" y1="177" x2="1675" y2="195"/>
    <line x1="1807" y1="177" x2="1825" y2="195"/>
  </g>
