<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <g stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- House body -->
    <rect x="560" y="420" width="480" height="360"/>
    <!-- Roof -->
    <polygon points="520,420 800,180 1080,420"/>
    <!-- Door -->
    <rect x="740" y="580" width="120" height="200"/>
    <!-- Doorknob -->
    <circle cx="840" cy="685" r="8"/>
    <!-- Left window -->
    <rect x="600" y="500" width="100" height="80"/>
    <line x1="650" y1="500" x2="650" y2="580"/>
    <line x1="600" y1="540" x2="700" y2="540"/>
    <!-- Right window -->
    <rect x="900" y="500" width="100" height="80"/>
    <line x1="950" y1="500" x2="950" y2="580"/>
    <line x1="900" y1="540" x2="1000" y2="540"/>
    <!-- Chimney -->
    <rect x="920" y="220" width="60" height="140"/>
    <!-- Sun -->
    <circle cx="1500" cy="160" r="80"/>
    <line x1="1500" y1="50" x2="1500" y2="20"/>
    <line x1="1500" y1="270" x2="1500" y2="300"/>
    <line x1="1390" y1="160" x2="1360" y2="160"/>
    <line x1="1610" y1="160" x2="1640" y2="160"/>
    <line x1="1422" y1="82" x2="1400" y2="60"/>
    <line x1="1578" y1="82" x2="1600" y2="60"/>
    <line x1="1422" y1="238" x2="1400" y2="260"/>
    <line x1="1578" y1="238" x2="1600" y2="260"/>
    <!-- Ground line -->
    <line x1="100" y1="780" x2="1820" y2="780"/>
    <!-- Path to door -->
    <line x1="740" y1="780" x2="720" y2="810" stroke="none"/>
    <path d="M740,780 L700,880 L900,880 L860,780" fill="none"/>
    <!-- Cloud -->
    <circle cx="350" cy="140" r="50"/>
    <circle cx="410" cy="120" r="60"/>
    <circle cx="480" cy="140" r="50"/>
    <!-- Tree -->
    <rect x="1250" y="550" width="40" height="230"/>
    <circle cx="1270" cy="480" r="100"/>
    <!-- Flowers -->
    <circle cx="300" cy="740" r="15"/>
    <circle cx="285" cy="725" r="10"/>
    <circle cx="315" cy="725" r="10"/>
    <circle cx="285" cy="755" r="10"/>
    <circle cx="315" cy="755" r="10"/>
    <line x1="300" y1="755" x2="300" y2="780"/>
  </g>
