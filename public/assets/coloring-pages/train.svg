<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <g stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Engine body -->
    <rect x="200" y="350" width="400" height="300" rx="10"/>
    <!-- Cabin -->
    <rect x="200" y="250" width="200" height="100"/>
    <rect x="220" y="270" width="70" height="60"/>
    <rect x="310" y="270" width="70" height="60"/>
    <!-- Roof -->
    <path d="M190,250 L410,250 Q420,240 410,230 L190,230 Q180,240 190,250"/>
    <!-- Smokestack -->
    <rect x="500" y="250" width="50" height="100"/>
    <path d="M490,250 L560,250"/>
    <ellipse cx="525" cy="240" rx="35" ry="15"/>
    <!-- Smoke -->
    <circle cx="530" cy="190" r="25"/>
    <circle cx="560" cy="150" r="30"/>
    <circle cx="600" cy="120" r="22"/>
    <!-- Cow catcher -->
    <path d="M600,650 L660,550 L660,650"/>
    <!-- Engine wheels -->
    <circle cx="300" cy="680" r="50"/>
    <circle cx="300" cy="680" r="20"/>
    <circle cx="480" cy="680" r="50"/>
    <circle cx="480" cy="680" r="20"/>
    <!-- Connector -->
    <line x1="600" y1="500" x2="700" y2="500"/>
    <!-- Car 1 -->
    <rect x="700" y="380" width="350" height="270" rx="8"/>
    <rect x="720" y="400" width="120" height="100"/>
    <rect x="860" y="400" width="120" height="100"/>
    <!-- Car 1 wheels -->
    <circle cx="800" cy="680" r="40"/>
    <circle cx="800" cy="680" r="16"/>
    <circle cx="950" cy="680" r="40"/>
    <circle cx="950" cy="680" r="16"/>
    <!-- Connector -->
    <line x1="1050" y1="500" x2="1150" y2="500"/>
    <!-- Car 2 -->
    <rect x="1150" y="380" width="350" height="270" rx="8"/>
    <rect x="1170" y="400" width="120" height="100"/>
    <rect x="1310" y="400" width="120" height="100"/>
    <!-- Car 2 wheels -->
    <circle cx="1250" cy="680" r="40"/>
    <circle cx="1250" cy="680" r="16"/>
    <circle cx="1400" cy="680" r="40"/>
    <circle cx="1400" cy="680" r="16"/>
    <!-- Caboose connector -->
    <line x1="1500" y1="500" x2="1560" y2="500"/>
    <!-- Caboose -->
    <rect x="1560" y="400" width="200" height="250" rx="8"/>
    <rect x="1590" y="320" width="140" height="80"/>
    <rect x="1610" y="340" width="40" height="40"/>
    <rect x="1710" y="340" width="40" height="40"/>
    <!-- Caboose wheel -->
    <circle cx="1660" cy="680" r="40"/>
    <circle cx="1660" cy="680" r="16"/>
    <!-- Track -->
    <line x1="100" y1="730" x2="1820" y2="730"/>
    <line x1="100" y1="740" x2="1820" y2="740"/>
    <!-- Ties -->
    <line x1="200" y1="740" x2="200" y2="760"/>
    <line x1="300" y1="740" x2="300" y2="760"/>
    <line x1="400" y1="740" x2="400" y2="760"/>
    <line x1="500" y1="740" x2="500" y2="760"/>
    <line x1="600" y1="740" x2="600" y2="760"/>
    <line x1="700" y1="740" x2="700" y2="760"/>
    <line x1="800" y1="740" x2="800" y2="760"/>
    <line x1="900" y1="740" x2="900" y2="760"/>
    <line x1="1000" y1="740" x2="1000" y2="760"/>
    <line x1="1100" y1="740" x2="1100" y2="760"/>
    <line x1="1200" y1="740" x2="1200" y2="760"/>
    <line x1="1300" y1="740" x2="1300" y2="760"/>
    <line x1="1400" y1="740" x2="1400" y2="760"/>
    <line x1="1500" y1="740" x2="1500" y2="760"/>
    <line x1="1600" y1="740" x2="1600" y2="760"/>
    <line x1="1700" y1="740" x2="1700" y2="760"/>
  </g>
